<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Unbounded';src:url('../node_modules/@fontsource-variable/unbounded/files/unbounded-latin-wght-normal.woff2') format('woff2');font-weight:200 900;}
@font-face{font-family:'Michroma';src:url('../node_modules/@fontsource/michroma/files/michroma-latin-400-normal.woff2') format('woff2');}
:root{--ink:#0b0b0b;--lime:#c7f431;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--fg);}
#stage.sq{height:1080px;}
.dark{--bg:#0b0b0b;--fg:#fff;--line:rgba(255,255,255,.05);--glow:rgba(199,244,49,.24);--ring:rgba(255,255,255,.1);}
.light{--bg:#fff;--fg:#0b0b0b;--line:rgba(0,0,0,.055);--glow:rgba(199,244,49,.34);--ring:rgba(0,0,0,.08);}
.lime{--bg:#c7f431;--fg:#0b0b0b;--line:rgba(0,0,0,.07);--glow:rgba(255,255,255,.35);--ring:rgba(0,0,0,.12);}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 2px,transparent 2px),linear-gradient(90deg,var(--line) 2px,transparent 2px);background-size:120px 120px;background-position:calc(50% - 60px) calc(50% - 60px);}
.glow{position:absolute;left:50%;top:50%;width:1300px;height:1300px;margin:-650px 0 0 -650px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 62%);}
.ring{position:absolute;left:50%;top:50%;width:640px;height:640px;margin:-320px 0 0 -320px;border-radius:50%;border:3px solid var(--ring);}
.ico{position:absolute;left:50%;top:50%;width:470px;height:470px;margin:-235px 0 0 -235px;}
.ico svg{width:100%;height:100%;display:block;overflow:visible;}
.word{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-family:'Unbounded';font-weight:800;font-size:250px;letter-spacing:-.03em;line-height:1;}
.word i{font-style:normal;color:var(--lime);}
.lime .word i{color:var(--fg);}
.grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;}
</style></head>
<body>
<div id="stage">
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="ring"></div>
  <div class="ico" id="ico">
    <!-- Megafon: Korpus in Schriftfarbe, Schallwellen in Lime -->
    <svg viewBox="0 0 100 100">
      <g fill="var(--fg)" stroke="var(--fg)" stroke-width="5" stroke-linejoin="round">
        <rect x="10" y="38" width="15" height="24" rx="3"/>
        <path d="M27 38 L60 21 L60 79 L27 62 Z"/>
        <path d="M30 63 L42 63 L46 82 L35 82 Z"/>
      </g>
      <g fill="none" stroke="var(--accent,#c7f431)" stroke-width="7" stroke-linecap="round">
        <path d="M72 38 Q78 50 72 62"/>
        <path d="M82 28 Q94 50 82 72"/>
      </g>
    </svg>
  </div>
  <div class="word" id="word">Ads<i>.</i></div>
  <svg class="grain" width="100%" height="100%"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>
<script>
const q = new URLSearchParams(location.search);
const st = document.getElementById('stage');
st.className = (q.get('v') || 'dark') + (q.get('s') === 'sq' ? ' sq' : '');
const mode = q.get('m') || 'icon';
document.getElementById(mode === 'icon' ? 'word' : 'ico').remove();
if (q.get('v') === 'lime') st.style.setProperty('--accent', '#0b0b0b');
document.fonts.ready.then(() => { window.__ready = true; });
</script>
</body></html>
